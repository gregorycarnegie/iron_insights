[workspace]
members = ["iron_insights_web", "iron_insights_pipeline", "iron_insights_core"]
default-members = [
  "iron_insights_core",
  "iron_insights_pipeline",
  "iron_insights_web",
]
resolver = "3"

[workspace.package]
version = "1.0.3"
edition = "2024"
rust-version = "1.96.0"

[workspace.dependencies]
# Internal crates
iron_insights_core = { path = "iron_insights_core" }

# Error handling
anyhow = "1.0.102"

# CLI
clap = { version = "4.6.1", features = ["derive"] }

# Date & time
chrono = { version = "0.4.45", default-features = false, features = [
  "clock",
  "serde",
] }

# Data processing
polars = { version = "0.54.4", default-features = false, features = [
  "lazy",
  "csv",
  "parquet",
  "dtype-categorical",
  "strings",
  "temporal",
] }

# HTTP client
reqwest = { version = "0.13.4", default-features = false, features = [
  "blocking",
  "rustls",
] }

# Serialization, encoding & compression
base64 = "0.22.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# Web framework (frontend)
leptos = { version = "0.8.19", features = ["csr"] }

# WASM & browser bindings
gloo-net = "0.7.0"
gloo-timers = "0.4.0"
js-sys = "0.3.102"
wasm-bindgen = "0.2.125"
wasm-bindgen-futures = "0.4.75"
web-sys = { version = "0.3.102", features = [
  "AbortController",
  "AbortSignal",
  "CanvasGradient",
  "CanvasRenderingContext2d",
  "Clipboard",
  "Document",
  "Element",
  "History",
  "HtmlAnchorElement",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlInputElement",
  "Location",
  "Navigator",
  "Storage",
  "UrlSearchParams",
  "Window",
] }

# Testing
proptest = { version = "1.11.0", default-features = false, features = [
  "alloc",
  "no_std",
] }
wasm-bindgen-test = "0.3.75"

[package]
name = "iron_insights"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
