[workspace]
members = ["iron_insights_web", "iron_insights_pipeline", "iron_insights_core"]
resolver = "3"

[workspace.package]
version = "1.2.0"
edition = "2024"
rust-version = "1.96.0"

[workspace.dependencies]
# Internal crates
iron_insights_core = { path = "iron_insights_core" }

# Error handling
anyhow = "1.0.104"

# CLI
clap = { version = "4.6.4", features = ["derive"] }

# Date & time
chrono = { version = "0.4.45", default-features = false, features = [
  "clock",
  "serde",
] }

# Data processing
polars = { version = "0.54.4", default-features = false, features = [
  "lazy",
  "csv",
  "parquet",
  "dtype-categorical",
  "strings",
  "temporal",
] }

# HTTP client
reqwest = { version = "0.13.4", default-features = false, features = [
  "blocking",
  "rustls",
] }

# Serialization, encoding & compression
base64 = "0.23.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# Web framework (frontend)
leptos = { version = "0.8.20", features = ["csr"] }

# WASM & browser bindings
gloo-net = "0.7.0"
js-sys = "0.3.103"
wasm-bindgen = "0.2.126"
web-sys = { version = "0.3.103", features = [
  "AbortController",
  "AbortSignal",
  "CanvasGradient",
  "CanvasRenderingContext2d",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlInputElement",
  "Location",
  "Storage",
  "UrlSearchParams",
  "Window",
] }

# Testing
proptest = { version = "1.11.0", default-features = false, features = [
  "alloc",
  "no_std",
] }
wasm-bindgen-test = "0.3.76"
